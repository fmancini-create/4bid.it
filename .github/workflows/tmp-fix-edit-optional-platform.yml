name: Temp Fix Edit Optional Platform

on:
  push:
    branches:
      - fix/edit-optional-platform

permissions:
  contents: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/edit-optional-platform
      - name: Apply targeted change
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("app/admin/quotes/edit/[id]/quote-catalog-editor.tsx")
          text = path.read_text()
          old = '''        <div className="flex items-center gap-2"><Switch checked={!!item.optional} disabled={item.kind === "plan"} onCheckedChange={v => patchLine(index, { optional: v, default_selected: v ? item.default_selected !== false : true })} /><Label>Opzionale per il cliente</Label></div>'''
          new = '''        {(() => {
          const earlierPlatformExists = lines.slice(0, index).some(candidate =>
            candidate.project !== item.project && ["hotelaccelerator", "santaddeo", "hotelprofitai", "manubot"].includes(String(candidate.project || "")),
          )
          const canBeOptional = item.kind !== "plan" || earlierPlatformExists
          return <div className="flex items-center gap-2"><Switch checked={!!item.optional} disabled={!canBeOptional} onCheckedChange={v => patchLine(index, { optional: v, default_selected: v ? item.default_selected !== false : true })} /><Label>{item.kind === "plan" ? "Piattaforma opzionale" : "Opzionale per il cliente"}</Label></div>
        })()}'''
          if old not in text:
              raise SystemExit("Target optional block not found")
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit targeted change
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/admin/quotes/edit/[id]/quote-catalog-editor.tsx'
          git commit -m "fix(quotes): unlock optional platform in edit page"
          git push origin HEAD:fix/edit-optional-platform
