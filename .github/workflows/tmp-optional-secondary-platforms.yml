name: Temp Optional Secondary Platforms

on:
  push:
    branches:
      - feat/optional-secondary-platforms

permissions:
  contents: write

jobs:
  apply-change:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/optional-secondary-platforms
      - name: Apply targeted change
        shell: python
        run: |
          from pathlib import Path

          path = Path("app/admin/quotes/commerce/quote-commerce-builder.tsx")
          text = path.read_text()

          anchor = '      const setupAnnualMode: AnnualSetupMode = meta.annual_setup_mode ?? (meta.free_on_annual ? "free" : "full")\n'
          addition = '      const canBeOptional = item.kind !== "plan" || items.slice(0, index).some(candidate => candidate.kind === "plan")\n'
          if addition not in text:
              if anchor not in text:
                  raise SystemExit("Anchor for canBeOptional not found")
              text = text.replace(anchor, anchor + addition, 1)

          old = '''        <div className="rounded-lg border bg-muted/30 p-3 flex flex-wrap items-center gap-6"><div className="flex items-center gap-2"><Switch checked={!!item.optional} disabled={item.kind === 'plan'} onCheckedChange={optional => patchItem(index,{optional,default_selected:optional ? item.default_selected !== false : true})}/><div><Label>Voce opzionale</Label><p className="text-xs text-muted-foreground">Il cliente può includerla o escluderla.</p></div></div>{item.optional ? <div className="flex items-center gap-2"><Switch checked={item.default_selected !== false} onCheckedChange={default_selected => patchItem(index,{default_selected})}/><Label>Preselezionata</Label></div> : <span className="text-xs font-medium text-primary">Obbligatoria</span>}</div>'''
          new = '''        <div className="rounded-lg border bg-muted/30 p-3 flex flex-wrap items-center gap-6"><div className="flex items-center gap-2"><Switch checked={!!item.optional} disabled={!canBeOptional} onCheckedChange={optional => patchItem(index,{optional,default_selected:optional ? item.default_selected !== false : true})}/><div><Label>{item.kind === "plan" ? "Piattaforma opzionale" : "Voce opzionale"}</Label><p className="text-xs text-muted-foreground">{item.kind === "plan" && !canBeOptional ? "La prima piattaforma resta obbligatoria. Le piattaforme inserite dopo possono essere lasciate alla scelta del cliente." : "Il cliente può includerla o escluderla."}</p></div></div>{item.optional ? <div className="flex items-center gap-2"><Switch checked={item.default_selected !== false} onCheckedChange={default_selected => patchItem(index,{default_selected})}/><Label>Preselezionata</Label></div> : <span className="text-xs font-medium text-primary">Obbligatoria</span>}</div>'''
          if new not in text:
              if old not in text:
                  raise SystemExit("Optional switch block not found")
              text = text.replace(old, new, 1)

          path.write_text(text)
      - name: Commit targeted change
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/admin/quotes/commerce/quote-commerce-builder.tsx
          git commit -m "Preventivi: piattaforme secondarie opzionali"
          git push origin HEAD:feat/optional-secondary-platforms
