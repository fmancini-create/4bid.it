name: Quote Engine CI

on:
  push:
    branches:
      - feat/quote-commerce-engine
  pull_request:
    branches:
      - 4bid

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quote tests
        run: |
          set -o pipefail
          pnpm exec vitest run tests/quote-multihotel-ecosystem.test.ts --reporter=verbose 2>&1 | tee quote-test-output.txt

      - name: Upload quote test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-test-output
          path: quote-test-output.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
          NEXT_PUBLIC_SUPABASE_URL: 'https://vsoqfztobpaxmjbijrhw.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder'
          SUPABASE_SERVICE_ROLE_KEY: 'ci-placeholder'
          RESEND_API_KEY: 're_ci_placeholder'
          STRIPE_SECRET_KEY: 'sk_test_ci_placeholder'
