name: Quote Engine CI

on:
  push:
    branches:
      - feat/quote-commerce-engine
  pull_request:
    branches:
      - 4bid

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint diagnostic
        id: lint
        continue-on-error: true
        run: pnpm lint

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Lint status
        if: always()
        run: echo "Lint outcome: ${{ steps.lint.outcome }} (non-blocking because the repository has pre-existing lint debt; build remains blocking)"
