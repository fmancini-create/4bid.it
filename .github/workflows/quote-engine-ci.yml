name: Quote Engine CI

on:
  push:
    branches:
      - feat/quote-commerce-engine
  pull_request:
    branches:
      - 4bid

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Quote tests
        run: |
          set -o pipefail
          pnpm exec vitest run tests/quote-multihotel-ecosystem.test.ts --reporter=verbose 2>&1 | tee quote-test-output.txt

      - name: TypeScript on changed quote files
        run: |
          set +e
          pnpm exec tsc --noEmit > typecheck-output.txt 2>&1
          tsc_status=$?
          set -e
          cat typecheck-output.txt
          changed_errors=$(grep -E '^(app/admin/quotes/edit/\[id\]/quote-expansion-editor\.tsx|app/api/quotes/\[id\]/route\.ts|app/api/quotes/shared/\[token\]/ecosystem/route\.ts|app/preventivo/\[token\]/page\.tsx|app/preventivo/\[token\]/ecosistema/page\.tsx|app/preventivo/\[token\]/ecosistema/ecosystem-browser\.tsx|app/preventivo/\[token\]/ecosystem-invite\.tsx|lib/quotes/ecosystem\.ts|tests/quote-multihotel-ecosystem\.test\.ts)' typecheck-output.txt || true)
          if [ -n "$changed_errors" ]; then
            echo "TypeScript errors found in files changed by this pull request."
            exit 1
          fi
          if [ "$tsc_status" -ne 0 ]; then
            echo "TypeScript baseline errors exist outside the files changed by this pull request; full report retained as artifact."
          fi

      - name: Upload quote CI reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quote-ci-reports
          path: |
            quote-test-output.txt
            typecheck-output.txt
          if-no-files-found: ignore
          retention-days: 3

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          NEXT_PUBLIC_SITE_URL: 'http://localhost:3000'
          NEXT_PUBLIC_SUPABASE_URL: 'https://vsoqfztobpaxmjbijrhw.supabase.co'
          NEXT_PUBLIC_SUPABASE_ANON_KEY: 'ci-placeholder'
          SUPABASE_SERVICE_ROLE_KEY: 'ci-placeholder'
          RESEND_API_KEY: 're_ci_placeholder'
          STRIPE_SECRET_KEY: 'sk_test_ci_placeholder'
