name: Temp Advanced Optional Fix

on:
  push:
    branches:
      - fix/edit-optional-platform-v2

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/edit-optional-platform-v2
      - name: Patch advanced editor
        run: |
          python3 .github/scripts/temp_patch_advanced_optional.py
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 'app/admin/quotes/edit/[id]/quote-catalog-editor.tsx'
          git commit -m "fix(quotes): unlock optional platform in advanced editor"
          git push origin HEAD:fix/edit-optional-platform-v2
