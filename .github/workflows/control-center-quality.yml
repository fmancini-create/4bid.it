name: Control Center quality

on:
  pull_request:
    paths:
      - "app/admin/control-center/**"
      - "app/api/admin/control-center/**"
      - "app/api/cron/technical-audit/**"
      - "lib/control-center/**"
      - "scripts/071_technical_audit_control_center.sql"
      - "package.json"
      - "pnpm-lock.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
